<div style="text-align: center; padding: 20px; font-family: sans-serif;">
  <h1>🎬 Catálogo de Películas TMDB</h1>
  <p>Las películas más populares del momento</p>

  <div style="margin-top: 10px;">
    <a routerLink="/top-rated" style="display: inline-block; padding: 8px 16px; background-color: #ffc107; color: #000; text-decoration: none; border-radius: 6px; font-weight: bold;">
      ⭐ Ver Mejor Valoradas
    </a>
  </div>

  <div style="margin: 20px 0; display: flex; justify-content: center; gap: 10px;">
    <input 
      type="text" 
      [(ngModel)]="busqueda" 
      (keyup.enter)="buscarPeliculas()"
      placeholder="Buscar película..." 
      style="padding: 10px 15px; border: 1px solid #ccc; border-radius: 6px; width: 300px; font-size: 14px;"
    />
    <button 
      (click)="buscarPeliculas()" 
      style="padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px;"
    >
      Buscar
    </button>
  </div>

  <div *ngIf="cargando" style="margin-top: 50px;">
    <p>Cargando películas...</p>
  </div>

  <div *ngIf="!cargando" style="display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-top: 30px;">
    <div *ngFor="let pelicula of peliculas" style="width: 200px; border: 1px solid #ddd; border-radius: 8px; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
      <img 
        [src]="pelicula.poster_path ? 'https://image.tmdb.org/t/p/w500' + pelicula.poster_path : 'https://via.placeholder.com/500x750?text=Sin+Imagen'" 
        [alt]="pelicula.title" 
        style="width: 100%; border-radius: 6px;"
      />
      <h3 style="font-size: 15px; margin: 10px 0 5px 0;">{{ pelicula.title }}</h3>
      <p style="font-size: 13px; color: #666; margin: 0;">⭐ {{ pelicula.vote_average }}</p>
    </div>
  </div>
</div>

<!-- 👈 Este conector permite que las vistas secundarias como /top-rated se muestren -->
<router-outlet></router-outlet>
