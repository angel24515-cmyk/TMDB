<div class="container my-4">
  <header class="text-center mb-4">
    <h1 class="fw-bold text-primary">🎬 Catálogo de Películas TMDB</h1>
    <p class="text-muted">Las películas más populares del momento</p>
  </header>

  <!-- Buscador -->
  <div class="row justify-content-center mb-4">
    <div class="col-md-6">
      <form (ngSubmit)="buscarPeliculas()" class="input-group">
        <input 
          type="text" 
          class="form-control" 
          placeholder="Buscar película..." 
          [(ngModel)]="textoBusqueda" 
          name="busqueda"
        >
        <button class="btn btn-primary" type="submit">🔍 Buscar</button>
      </form>
    </div>
  </div>

  <!-- Spinner -->
  <div *ngIf="cargando" class="text-center my-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <!-- Tarjetas de Películas -->
  <div *ngIf="!cargando" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
    <div class="col" *ngFor="let pelicula of peliculas">
      <div 
        class="card h-100 shadow-sm border-0" 
        (click)="verDetalles(pelicula.id)" 
        style="cursor: pointer;"
      >
        <img 
          [src]="pelicula.poster_path ? 'https://image.tmdb.org/t/p/w500' + pelicula.poster_path : 'https://via.placeholder.com/500x750?text=Sin+Imagen'" 
          class="card-img-top" 
          [alt]="pelicula.title"
        >
        <div class="card-body d-flex flex-column justify-content-between">
          <h5 class="card-title fs-6 fw-bold text-truncate">{{ pelicula.title }}</h5>
          <div class="d-flex justify-content-between align-items-center mt-2">
            <span class="badge bg-warning text-dark">⭐ {{ pelicula.vote_average }}</span>
            <small class="text-muted">{{ pelicula.release_date }}</small>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
